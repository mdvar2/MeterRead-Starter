name: meterread
description: "MeterRead: an electricity meter reader's round. Week 11 revision challenge."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Exact versions, at least two weeks old, no ^ (as Matric Compass).
dependencies:
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 18.1.1
  intl: 0.20.3
  riverpod_annotation: 4.0.7
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
  go_router_builder: 4.5.2
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  # gen-l10n: lib/l10n/*.arb become AppLocalizations (see l10n.yaml).
  generate: true

# Packages pulled in by drift, flutter_secure_storage, go_router and
# shared_preferences whose newest releases were under two weeks old when
# this starter was made (23 November 2026). Each is held at the newest
# release that was two weeks old. Leave these lines alone today.
dependency_overrides:
  code_assets: 2.1.0
  material_ui: 1.10.0
  native_toolchain_c: 0.19.5
  objective_c: 9.6.2
  shared_preferences_android: 2.5.4
  shared_preferences_foundation: 2.6.1
  sqlite3: 3.8.0
